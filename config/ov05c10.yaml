# libcamera software-ISP tuning for the OmniVision OV05C10.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      # Measured: dark frames sit at 64/1023 (10-bit) = 4096 on libcamera's 16-bit scale.
      blackLevel: 4096
  - Awb:
  # Generic (uncalibrated) OmniVision-style CCM (rows sum to 1, whites stay white); also enables Saturation.
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1.60, -0.45, -0.15,
                 -0.30, 1.55, -0.25,
                 -0.05, -0.55, 1.60 ]
  - Adjust:
  - Agc:
...
